<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PaceOn">
  <title>PaceOn</title>
  <!-- O Sinal de Pace: três traços paralelos (1 horizontal : 2 vertical), comprimentos
       crescentes. O último em cor de destaque é o treino de hoje, ajustado pela IA. -->
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M10 48 L16 36" stroke="#0A0E17"/>
    <path d="M24 48 L34 28" stroke="#0A0E17"/>
    <path d="M38 48 L52 20" stroke="#4B3BFF"/>
  </g>
</svg>
